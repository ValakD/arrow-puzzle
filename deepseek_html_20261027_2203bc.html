<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake 3D Forest — Playgama</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#0a1a0a;color:#fff;user-select:none}
  canvas#game{display:block;width:100vw;height:100vh}
  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
  #hud .top-bar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;pointer-events:auto}
  .pill{background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border-radius:24px;padding:7px 16px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .pill .coin{color:#ffd700}
  .pill .score{color:#7fff7f}
  .btn-icon{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;pointer-events:auto}
  .btn-icon:active{transform:scale(.92)}
  /* ---------- Screens ---------- */
  .screen{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.82);backdrop-filter:blur(12px);padding:16px;overflow-y:auto}
  .screen.active{display:flex}
  .screen h1{font-size:clamp(26px,6vw,44px);margin-bottom:6px;text-align:center}
  .screen h2{font-size:clamp(18px,4vw,26px);margin:12px 0 4px;color:#aaffaa}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 40px;font-size:clamp(15px,3.5vw,19px);font-weight:700;border:none;border-radius:32px;cursor:pointer;transition:transform .12s,filter .12s;margin:6px;min-width:200px;color:#fff}
  .btn:active{transform:scale(.95);filter:brightness(.9)}
  .btn-primary{background:linear-gradient(135deg,#44dd66,#229944);box-shadow:0 4px 18px rgba(68,221,102,.35)}
  .btn-secondary{background:linear-gradient(135deg,#4488ff,#2255cc);box-shadow:0 4px 18px rgba(68,136,255,.3)}
  .btn-gold{background:linear-gradient(135deg,#ffcc33,#dd9900);color:#332200;box-shadow:0 4px 18px rgba(255,204,51,.35)}
  .btn-ad{background:linear-gradient(135deg,#aa44ff,#7722cc);box-shadow:0 4px 18px rgba(170,68,255,.35)}
  .btn-small{padding:9px 20px;font-size:14px;min-width:120px;border-radius:20px}
  .btn:disabled{opacity:.45;filter:grayscale(.6);cursor:not-allowed;transform:none}
  .menu-buttons{display:flex;flex-direction:column;align-items:center;margin-top:18px;width:100%;max-width:340px}
  .menu-buttons .btn{width:100%;margin:5px 0}
  /* ---------- Shop grid ---------- */
  .shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;width:100%;max-width:760px;margin:10px 0 20px}
  .shop-card{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;transition:border-color .2s}
  .shop-card.owned{border-color:#44dd66}
  .shop-card.equipped{border-color:#ffd700;box-shadow:0 0 18px rgba(255,215,0,.35)}
  .shop-card .preview{width:60px;height:60px;border-radius:50%;margin-bottom:8px;border:3px solid rgba(255,255,255,.3);flex-shrink:0}
  .shop-card .card-name{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.2}
  .shop-card .card-actions{display:flex;flex-direction:column;gap:4px;width:100%}
  .shop-card .card-actions .btn{min-width:0;width:100%;padding:7px 6px;font-size:12px;border-radius:14px;margin:0}
  .shop-card .badge{position:absolute;top:6px;right:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:#ffd700;color:#332200}
  /* ---------- Settings ---------- */
  .settings-box{background:rgba(255,255,255,.06);border-radius:20px;padding:24px 28px;width:100%;max-width:380px;margin:10px 0}
  .setting-row{display:flex;align-items:center;gap:14px;margin:16px 0}
  .setting-row label{font-size:14px;font-weight:600;min-width:90px;flex-shrink:0}
  .setting-row input[type=range]{flex:1;accent-color:#44dd66;height:6px;cursor:pointer}
  .setting-row .val{font-size:13px;min-width:38px;text-align:right;color:#aaffaa;font-weight:700}
  .top-right{position:absolute;top:14px;right:14px;display:flex;gap:8px;z-index:20}
  .top-left{position:absolute;top:14px;left:14px;z-index:20}
  /* ---------- Game over ---------- */
  #gameover-screen .stats{display:flex;gap:24px;margin:12px 0 18px}
  #gameover-screen .stat{text-align:center}
  #gameover-screen .stat .value{font-size:32px;font-weight:800;color:#ffd700}
  #gameover-screen .stat .label{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:1px}
  .scroll-hint{font-size:12px;opacity:.5;margin-top:6px}
  #loading{position:fixed;inset:0;background:#0a1a0a;display:flex;align-items:center;justify-content:center;z-index:999;font-size:20px;transition:opacity .4s}
</style>
</head>

<canvas id="game"></canvas>

  </div>

  <button class="btn btn-secondary btn-small" id="btn-go-shop">🛒 Магазин</button>
  <button class="btn btn-ad btn-small" id="btn-go-double">📺 Удвоить монеты</button>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   GLOBAL STATE & HELPERS
   ============================================================ */
const $ = id => document.getElementById(id);
const RAD = Math.PI / 180;
const ARENA_R = 38;
const TREE_COUNT = 140;
const BOT_COUNT = 4;
const BOT_NAMES = ['Змей', 'Кобра', 'Питон', 'Удав', 'Гадюка', 'Анаконда'];

const state = {
  screen: 'menu',        // menu | settings | shop | playing | gameover
  score: 0,
  coins: 0,
  totalCoins: 0,
  sfxVolume: 0.8,
  musicVolume: 0.5,
  skin: 0,
  location: 0,
  ownedSkins: [0],
  ownedLocations: [0],
  bestScore: 0,
  snakeAlive: true,
};

/* ---------- Playgama ---------- */
let bridgeReady = false;
(async () => {
  try {
    if (window.bridge) {
      await bridge.initialize();
      bridgeReady = true;
      bridge.platform.sendMessage('game_ready');
      try {
        const saved = await bridge.storage.get('snake3d_save');
        if (saved) Object.assign(state, JSON.parse(saved));
      } catch (e) {}
      console.log('[Playgama] ready');
    }
  } catch (e) { console.warn('[Playgama] init fail', e); }
})();

function saveProgress() {
  if (bridgeReady) {
    bridge.storage.set('snake3d_save', JSON.stringify({
      coins: state.totalCoins, ownedSkins: state.ownedSkins,
      ownedLocations: state.ownedLocations, bestScore: state.bestScore,
      skin: state.skin, location: state.location,
      sfxVolume: state.sfxVolume, musicVolume: state.musicVolume,
    })).catch(() => {});
  }
}

/* ============================================================
   AUDIO
   ============================================================ */
let audioCtx = null;
let musicGain = null;
let sfxGain = null;
let musicTimer = null;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    sfxGain = audioCtx.createGain(); sfxGain.connect(audioCtx.destination);
    musicGain = audioCtx.createGain(); musicGain.connect(audioCtx.destination);
    updateVolumes();
    startMusic();
  } catch (e) {}
}
function updateVolumes() {
  if (sfxGain) sfxGain.gain.value = state.sfxVolume;
  if (musicGain) musicGain.gain.value = state.musicVolume * 0.18;
}
function beep(freq = 660, dur = 0.15, type = 'sine') {
  if (!audioCtx || state.sfxVolume <= 0) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.12, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(sfxGain);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function startMusic() {
  if (!audioCtx || musicTimer) return;
  const chords = [[220,277,330],[196,247,294],[174,220,262],[196,247,294]];
  let idx = 0;
  function playChord() {
    if (!audioCtx || state.musicVolume <= 0) { musicTimer = setTimeout(playChord, 3000); return; }
    const chord = chords[idx % chords.length]; idx++;
    chord.forEach(f => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0, audioCtx.currentTime);
      g.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.8);
      g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 3.5);
      o.connect(g); g.connect(musicGain);
      o.start(); o.stop(audioCtx.currentTime + 3.6);
    });
    musicTimer = setTimeout(playChord, 3400);
  }
  playChord();
}

/* ============================================================
   THREE.JS SETUP
   ============================================================ */
const canvas = $('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 180);
camera.position.set(0, 6, -10);

/* ---------- Lighting ---------- */
const ambient = new THREE.AmbientLight(0xaaccff, 0.8);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff2cc, 2.4);
sun.position.set(18, 30, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 80;
sun.shadow.camera.left = -45; sun.shadow.camera.right = 45;
sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -45;
sun.shadow.bias = -0.0006;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8899ff, 0.5);
fill.position.set(-15, 12, -10);
scene.add(fill);

/* ---------- LOCATIONS ---------- */
const LOCATIONS = [
  { name: 'Лес', ground: 0x4a8a3a, sky: 0x87c8e8, fog: 0x87c8e8, leaf: 0x2e7a2e, trunk: 0x5a3a22, far: 30, price: 0 },
  { name: 'Осень', ground: 0x8a6a2a, sky: 0xddaa66, fog: 0xddaa66, leaf: 0xcc6622, trunk: 0x4a2e1a, far: 30, price: 150 },
  { name: 'Ночь', ground: 0x1a2a3a, sky: 0x0a0a2a, fog: 0x0a0a2a, leaf: 0x1a4a3a, trunk: 0x2a1a0a, far: 26, price: 200 },
  { name: 'Сакура', ground: 0x6a9a5a, sky: 0xffccdd, fog: 0xffccdd, leaf: 0xff88aa, trunk: 0x5a3a2a, far: 28, price: 300 },
  { name: 'Пустыня', ground: 0xddaa55, sky: 0xffcc77, fog: 0xffcc77, leaf: 0x88aa44, trunk: 0x8a6a3a, far: 32, price: 250 },
];

/* ---------- SKINS ---------- */
const SKINS = [
  { name: 'Изумруд', head: 0x66ff88, body: 0x44cc66, price: 0 },
  { name: 'Кобальт', head: 0x66aaff, body: 0x4488dd, price: 100 },
  { name: 'Рубин', head: 0xff6666, body: 0xdd4444, price: 100 },
  { name: 'Золото', head: 0xffdd44, body: 0xddaa22, price: 250 },
  { name: 'Аметист', head: 0xcc66ff, body: 0xaa44dd, price: 200 },
  { name: 'Ледяной', head: 0x88ffff, body: 0x66dddd, price: 300 },
  { name: 'Тень', head: 0x666688, body: 0x444466, price: 350 },
];

/* ============================================================
   WORLD BUILD (ground + instanced forest)
   ============================================================ */
const worldGroup = new THREE.Group();
scene.add(worldGroup);

let groundMesh = null;
let treeInstances = []; // { x, z, radius }
let leafMesh = null;
let trunkMesh = null;

function buildWorld(locationIndex) {
  // clear previous
  while (worldGroup.children.length) {
    const c = worldGroup.children[0];
    worldGroup.remove(c);
    if (c.geometry) c.geometry.dispose();
    if (c.material) { Array.isArray(c.material) ? c.material.forEach(m => m.dispose()) : c.material.dispose(); }
  }
  treeInstances = [];

  const loc = LOCATIONS[locationIndex];
  scene.background = new THREE.Color(loc.sky);
  scene.fog = new THREE.Fog(loc.fog, loc.far, loc.far + 30);

  // Ground
  const gGeo = new THREE.CircleGeometry(ARENA_R + 18, 64);
  const gMat = new THREE.MeshStandardMaterial({ color: loc.ground, roughness: 0.95 });
  groundMesh = new THREE.Mesh(gGeo, gMat);
  groundMesh.rotation.x = -Math.PI / 2;
  groundMesh.receiveShadow = true;
  worldGroup.add(groundMesh);

  // Patchy ground details
  for (let i = 0; i < 70; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * (ARENA_R + 10);
    const patch = new THREE.Mesh(
      new THREE.CircleGeometry(0.6 + Math.random() * 1.4, 7),
      new THREE.MeshStandardMaterial({
        color: new THREE.Color(loc.ground).multiplyScalar(0.75 + Math.random() * 0.4),
        roughness: 1,
      })
    );
    patch.rotation.x = -Math.PI / 2;
    patch.rotation.z = Math.random() * Math.PI;
    patch.position.set(Math.cos(a) * r, 0.01, Math.sin(a) * r);
    worldGroup.add(patch);
  }

  // ===== Instanced forest =====
  const trunkGeo = new THREE.CylinderGeometry(0.18, 0.32, 4, 6);
  const trunkMat = new THREE.MeshStandardMaterial({ color: loc.trunk, roughness: 0.9 });
  trunkMesh = new THREE.InstancedMesh(trunkGeo, trunkMat, TREE_COUNT);
  trunkMesh.castShadow = true;
  trunkMesh.receiveShadow = true;

  const leafGeo = new THREE.SphereGeometry(1.6, 8, 6);
  const leafMat = new THREE.MeshStandardMaterial({ color: loc.leaf, roughness: 0.85 });
  leafMesh = new THREE.InstancedMesh(leafGeo, leafMat, TREE_COUNT * 3);
  leafMesh.castShadow = true;
  leafMesh.receiveShadow = true;

  const dummy = new THREE.Object3D();
  let leafIdx = 0;

  for (let i = 0; i < TREE_COUNT; i++) {
    // Распределяем деревья кольцами, оставляя центр свободным
    let x, z, dist;
    do {
      const a = Math.random() * Math.PI * 2;
      const r = 8 + Math.random() * (ARENA_R + 12 - 8);
      x = Math.cos(a) * r;
      z = Math.sin(a) * r;
      dist = Math.hypot(x, z);
    } while (dist < 7);

    const scale = 0.7 + Math.random() * 0.8;
    treeInstances.push({ x, z, radius: 0.4 * scale });

    // trunk
    dummy.position.set(x, 2 * scale, z);
    dummy.scale.set(scale, scale, scale);
    dummy.rotation.y = Math.random() * Math.PI;
    dummy.updateMatrix();
    trunkMesh.setMatrixAt(i, dummy.matrix);

    // 3 leaf blobs per tree
    for (let j = 0; j < 3; j++) {
      const lx = x + (Math.random() - 0.5) * 1.8 * scale;
      const lz = z + (Math.random() - 0.5) * 1.8 * scale;
      const ly = (4 + Math.random() * 1.8) * scale;
      dummy.position.set(lx, ly, lz);
      dummy.scale.setScalar(scale * (0.7 + Math.random() * 0.5));
      dummy.rotation.set(Math.random(), Math.random(), Math.random());
      dummy.updateMatrix();
      leafMesh.setMatrixAt(leafIdx++, dummy.matrix);
    }
  }
  leafMesh.count = leafIdx;

  worldGroup.add(trunkMesh);
  worldGroup.add(leafMesh);
}

/* ============================================================
   SNAKE CLASS (player + bots)
   ============================================================ */
class Snake {
  constructor(opts = {}) {
    this.isPlayer = !!opts.isPlayer;
    this.name = opts.name || '';
    this.skin = opts.skin || SKINS[0];
    this.pos = new THREE.Vector3(opts.x || 0, 0.5, opts.z || 0);
    this.dir = new THREE.Vector3(opts.dx || 0, 0, opts.dz || 1).normalize();
    this.speed = opts.speed || 6.2;
    this.turnSpeed = opts.turnSpeed || 2.8;
    this.trail = [];
    this.segments = [];
    this.headMesh = null;
    this.alive = true;
    this.score = 0;
    this.targetDir = this.dir.clone();
    this.aiTimer = 0;
    this.aiTarget = new THREE.Vector3();
    this.createMeshes();
  }

  createMeshes() {
    const headGeo = new THREE.SphereGeometry(0.5, 16, 12);
    const headMat = new THREE.MeshStandardMaterial({
      color: this.skin.head, roughness: 0.45, metalness: 0.1,
      emissive: this.skin.head, emissiveIntensity: 0.12,
    });
    this.headMesh = new THREE.Mesh(headGeo, headMat);
    this.headMesh.castShadow = true;
    this.headMesh.position.copy(this.pos);
    scene.add(this.headMesh);

    // eyes
    const eyeGeo = new THREE.SphereGeometry(0.11, 8, 6);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const pupilGeo = new THREE.SphereGeometry(0.055, 6, 6);
    const pupilMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
    [-1, 1].forEach(s => {
      const e = new THREE.Mesh(eyeGeo, eyeMat);
      e.position.set(s * 0.2, 0.18, 0.3); this.headMesh.add(e);
      const p = new THREE.Mesh(pupilGeo, pupilMat);
      p.position.set(0, 0, 0.07); e.add(p);
    });

    // tongue
    const tGeo = new THREE.BoxGeometry(0.05, 0.025, 0.2);
    const tMat = new THREE.MeshBasicMaterial({ color: 0xff3355 });
    this.tongue = new THREE.Mesh(tGeo, tMat);
    this.tongue.position.set(0, -0.04, 0.5);
    this.headMesh.add(this.tongue);

    // name tag for bots
    if (!this.isPlayer) {
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 64;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.beginPath(); ctx.roundRect(0, 0, 256, 64, 16); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 30px system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(this.name, 128, 34);
      const tex = new THREE.CanvasTexture(cv);
      tex.minFilter = THREE.LinearFilter;
      const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
      spr.scale.set(2.4, 0.6, 1);
      spr.position.set(0, 1.15, 0);
      this.headMesh.add(spr);
    }

    // initial segments
    for (let i = 0; i < 5; i++) this.addSegment();
  }

  addSegment() {
    const scale = 0.92 - Math.min(this.segments.length * 0.012, 0.3);
    const geo = new THREE.SphereGeometry(0.45, 12, 10);
    const mat = new THREE.MeshStandardMaterial({
      color: this.skin.body, roughness: 0.55, metalness: 0.05,
      emissive: this.skin.body, emissiveIntensity: 0.1,
    });
    const m = new THREE.Mesh(geo, mat);
    m.castShadow = true;
    m.scale.setScalar(Math.max(0.55, scale));
    scene.add(m);
    this.segments.push(m);
  }

  get length() { return this.segments.length + 1; }

  getTrailPos(distBehind) {
    const t = this.trail;
    if (t.length < 2) return this.pos.clone();
    let acc = 0;
    for (let i = t.length - 1; i > 0; i--) {
      const d = t[i].distanceTo(t[i - 1]);
      if (acc + d >= distBehind) {
        const k = (distBehind - acc) / d;
        return t[i].clone().lerp(t[i - 1], k);
      }
      acc += d;
    }
    return t[0].clone();
  }

  update(dt, turnInput) {
    if (!this.alive) return;

    // --- Steering ---
    if (this.isPlayer) {
      if (turnInput !== 0) {
        this.dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), turnInput * this.turnSpeed * dt);
        this.dir.y = 0; this.dir.normalize();
      }
    } else {
      this.aiThink(dt);
      // smooth turn toward targetDir
      const targetAngle = Math.atan2(this.targetDir.x, this.targetDir.z);
      const currentAngle = Math.atan2(this.dir.x, this.dir.z);
      let diff = targetAngle - currentAngle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      const maxTurn = this.turnSpeed * dt;
      const turn = Math.max(-maxTurn, Math.min(maxTurn, diff));
      this.dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), turn);
      this.dir.y = 0; this.dir.normalize();
    }

    // --- Move ---
    this.pos.addScaledVector(this.dir, this.speed * dt);
    this.pos.y = 0.5;

    // --- Obstacles: trees ---
    for (const t of treeInstances) {
      const dx = this.pos.x - t.x, dz = this.pos.z - t.z;
      const d = Math.hypot(dx, dz);
      const minD = t.radius + 0.55;
      if (d < minD && d > 0.001) {
        const nx = dx / d, nz = dz / d;
        this.pos.x = t.x + nx * minD;
        this.pos.z = t.z + nz * minD;
        // bounce direction slightly
        const dot = this.dir.x * nx + this.dir.z * nz;
        if (dot < 0) {
          this.dir.x -= 1.5 * dot * nx;
          this.dir.z -= 1.5 * dot * nz;
          this.dir.normalize();
        }
      }
    }

    // --- Arena boundary ---
    const distFromCenter = Math.hypot(this.pos.x, this.pos.z);
    if (distFromCenter > ARENA_R) {
      const nx = this.pos.x / distFromCenter, nz = this.pos.z / distFromCenter;
      this.pos.x = nx * ARENA_R; this.pos.z = nz * ARENA_R;
      const dot = this.dir.x * nx + this.dir.z * nz;
      this.dir.x -= 2 * dot * nx;
      this.dir.z -= 2 * dot * nz;
      this.dir.normalize();
    }

    // --- Trail ---
    this.trail.push(this.pos.clone());
    const maxTrail = Math.max(500, this.segments.length * 70);
    while (this.trail.length > maxTrail) this.trail.shift();

    // --- Visuals ---
    this.headMesh.position.copy(this.pos);
    this.headMesh.rotation.y = Math.atan2(this.dir.x, this.dir.z);
    this.tongue.position.z = 0.5 + Math.sin(performance.now() * 0.015) * 0.05;

    for (let i = 0; i < this.segments.length; i++) {
      const p = this.getTrailPos((i + 1) * 0.48);
      this.segments[i].position.copy(p);
      this.segments[i].position.y += Math.sin(performance.now() * 0.008 - i * 0.6) * 0.018;
    }

    // --- Self collision (player only, skip first few) ---
    if (this.isPlayer) {
      for (let i = 5; i < this.segments.length; i++) {
        if (this.segments[i].position.distanceTo(this.pos) < 0.7) {
          this.die();
          return;
        }
      }
    }
  }

  aiThink(dt) {
    this.aiTimer -= dt;
    if (this.aiTimer > 0) return;
    this.aiTimer = 0.18 + Math.random() * 0.12;

    // find nearest fruit
    let bestFruit = null, bestD = Infinity;
    for (const f of fruits) {
      if (!f.alive) continue;
      const d = this.pos.distanceTo(f.mesh.position);
      if (d < bestD) { bestD = d; bestFruit = f; }
    }

    // find nearby enemies
    let threat = null, threatD = Infinity;
    let prey = null, preyD = Infinity;
    for (const other of allSnakes) {
      if (other === this || !other.alive) continue;
      const d = this.pos.distanceTo(other.pos);
      if (d < 9) {
        if (other.length > this.length + 2 && d < threatD) { threat = other; threatD = d; }
        else if (other.length < this.length - 2 && d < preyD) { prey = other; preyD = d; }
      }
    }

    let target = null;

    if (threat && threatD < 7) {
      // flee: move away from threat
      target = this.pos.clone().add(this.pos.clone().sub(threat.pos).setY(0).normalize().multiplyScalar(12));
    } else if (prey && preyD < 8) {
      // chase prey
      target = prey.pos.clone();
    } else if (bestFruit) {
      // go to fruit
      target = bestFruit.mesh.position.clone();
    } else {
      // wander
      const a = Math.random() * Math.PI * 2;
      target = this.pos.clone().add(new THREE.Vector3(Math.cos(a) * 10, 0, Math.sin(a) * 10));
    }

    // Avoid trees: if path goes through a tree, add avoidance
    const desired = target.clone().sub(this.pos).setY(0).normalize();
    let avoidance = new THREE.Vector3();
    for (const t of treeInstances) {
      const toTree = new THREE.Vector3(t.x - this.pos.x, 0, t.z - this.pos.z);
      const dist = toTree.length();
      if (dist < 4 && dist > 0.1) {
        const forward = toTree.clone().normalize().dot(desired);
        if (forward > 0.3) {
          const perp = new THREE.Vector3(-toTree.z, 0, toTree.x).normalize();
          avoidance.addScaledVector(perp, (4 - dist) * 0.6);
        }
      }
    }

    // Avoid boundary
    const dc = Math.hypot(this.pos.x, this.pos.z);
    if (dc > ARENA_R - 5) {
      const inward = new THREE.Vector3(-this.pos.x, 0, -this.pos.z).normalize();
      avoidance.addScaledVector(inward, 3);
    }

    desired.add(avoidance).normalize();
    this.targetDir.copy(desired);
  }

  die() {
    if (!this.alive) return;
    this.alive = false;
    // scatter segments
    for (const s of this.segments) {
      scene.remove(s); s.geometry.dispose(); s.material.dispose();
    }
    scene.remove(this.headMesh);
    this.headMesh.geometry.dispose(); this.headMesh.material.dispose();
  }
}

/* ============================================================
   GAME OBJECTS
   ============================================================ */
const FRUIT_TYPES = [
  { name: 'apple', color: 0xff3333, points: 10, size: 0.4, freq: 520 },
  { name: 'pear', color: 0xaadd22, points: 15, size: 0.36, freq: 580 },
  { name: 'orange', color: 0xff8800, points: 20, size: 0.4, freq: 620 },
  { name: 'plum', color: 0x9933cc, points: 25, size: 0.3, freq: 680 },
  { name: 'lemon', color: 0xffcc00, points: 30, size: 0.28, freq: 740 },
];

const fruits = [];
const allSnakes = [];
let player = null;
let spawnTimer = 0;
const SPAWN_INTERVAL = 1.1;
const MAX_FRUITS = 22;

function spawnFruit() {
  if (fruits.length >= MAX_FRUITS) return;
  const type = FRUIT_TYPES[Math.floor(Math.random() * FRUIT_TYPES.length)];
  const a = Math.random() * Math.PI * 2;
  const r = Math.sqrt(Math.random()) * (ARENA_R - 4);
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(type.size, 12, 10),
    new THREE.MeshStandardMaterial({
      color: type.color, roughness: 0.35, metalness: 0.15,
      emissive: type.color, emissiveIntensity: 0.12,
    })
  );
  mesh.position.set(Math.cos(a) * r, 10 + Math.random() * 4, Math.sin(a) * r);
  mesh.castShadow = true;
  mesh.scale.setScalar(0.1);
  scene.add(mesh);
  fruits.push({ mesh, type, vy: 0, alive: true, grow: 0.1 });
}

function updateFruits(dt) {
  for (let i = fruits.length - 1; i >= 0; i--) {
    const f = fruits[i];
    if (!f.alive) continue;
    if (f.grow < 1) { f.grow = Math.min(1, f.grow + dt * 5); f.mesh.scale.setScalar(f.grow); }
    f.vy -= 18 * dt;
    f.mesh.position.y += f.vy * dt;
    if (f.mesh.position.y <= f.type.size) { f.mesh.position.y = f.type.size; f.vy = 0; }

    // check eaten by any snake
    for (const s of allSnakes) {
      if (!s.alive) continue;
      if (s.pos.distanceTo(f.mesh.position) < 0.55 + f.type.size + 0.1) {
        // eat
        scene.remove(f.mesh); f.mesh.geometry.dispose(); f.mesh.material.dispose();
        fruits.splice(i, 1);
        s.score += f.type.points;
        if (s.isPlayer) { state.score += f.type.points; state.coins += 1; beep(f.type.freq); updateHUD(); }
        s.addSegment();
        break;
      }
    }
  }
}

/* ============================================================
   COLLISIONS: snake vs snake (eating)
   ============================================================ */
function checkSnakeCollisions() {
  for (let i = 0; i < allSnakes.length; i++) {
    const a = allSnakes[i];
    if (!a.alive) continue;
    for (let j = i + 1; j < allSnakes.length; j++) {
      const b = allSnakes[j];
      if (!b.alive) continue;
      const d = a.pos.distanceTo(b.pos);
      if (d < 1.0) {
        // bigger eats smaller
        if (a.length > b.length + 1) { eatSnake(a, b); }
        else if (b.length > a.length + 1) { eatSnake(b, a); }
        else {
          // same length: bounce
          const n = a.pos.clone().sub(b.pos).setY(0).normalize();
          a.dir.addScaledVector(n, 0.5).normalize();
          b.dir.addScaledVector(n, -0.5).normalize();
        }
      }
    }
  }
}

function eatSnake(eater, victim) {
  victim.die();
  const gain = Math.max(3, Math.floor(victim.length / 2));
  for (let k = 0; k < gain; k++) eater.addSegment();
  eater.score += victim.length * 5;
  if (eater.isPlayer) {
    state.score += victim.length * 5;
    state.coins += Math.max(5, victim.length);
    beep(880, 0.3, 'square');
    updateHUD();
  }
  if (victim.isPlayer) {
    gameOver();
  }
  // respawn bot after delay
  if (!victim.isPlayer) {
    setTimeout(() => respawnBot(victim.name), 3000);
  }
}

function respawnBot(name) {
  if (state.screen !== 'playing') return;
  const a = Math.random() * Math.PI * 2;
  const r = 20 + Math.random() * 10;
  const bot = new Snake({
    isPlayer: false, name,
    x: Math.cos(a) * r, z: Math.sin(a) * r,
    skin: SKINS[Math.floor(Math.random() * SKINS.length)],
    speed: 5.4 + Math.random() * 1.2,
  });
  allSnakes.push(bot);
}

/* ============================================================
   PLAYER INPUT
   ============================================================ */
const keys = { left: false, right: false };
const pointers = new Map();

addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'ф') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'в') keys.right = true;
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'ф') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'в') keys.right = false;
});
canvas.addEventListener('pointerdown', e => {
  if (state.screen !== 'playing') return;
  initAudio();
  pointers.set(e.pointerId, e.clientX < innerWidth / 2 ? 'left' : 'right');
});
canvas.addEventListener('pointerup', e => pointers.delete(e.pointerId));
canvas.addEventListener('pointercancel', e => pointers.delete(e.pointerId));

function getTurnInput() {
  let t = 0;
  if (keys.left) t -= 1;
  if (keys.right) t += 1;
  for (const side of pointers.values()) t += side === 'right' ? 1 : -1;
  return Math.max(-1, Math.min(1, t));
}

/* ============================================================
   GAME LOOP
   ============================================================ */
let lastTime = performance.now();
let gameRunning = false;

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.08);
  lastTime = now;

  if (!gameRunning) return;

  const turn = getTurnInput();
  for (const s of allSnakes) s.update(dt, s.isPlayer ? turn : 0);
  updateFruits(dt);
  checkSnakeCollisions();
  updateCamera(dt);

  // spawn
  spawnTimer += dt;
  if (spawnTimer >= SPAWN_INTERVAL) { spawnTimer = 0; spawnFruit(); if (Math.random() < 0.3) spawnFruit(); }

  // sun pulse
  sun.intensity = 2.3 + Math.sin(now * 0.001) * 0.15;

  renderer.render(scene, camera);
}

/* ---------- CAMERA ---------- */
const camDesired = new THREE.Vector3();
const camLook = new THREE.Vector3();
const camLookCurrent = new THREE.Vector3();

function updateCamera(dt) {
  if (!player || !player.alive) return;
  const back = player.dir.clone().multiplyScalar(-9);
  camDesired.copy(player.pos).add(back);
  camDesired.y = 5.5;
  camera.position.lerp(camDesired, Math.min(1, dt * 4.5));

  camLook.copy(player.pos).addScaledVector(player.dir, 4);
  camLook.y = 1.8;
  camLookCurrent.lerp(camLook, Math.min(1, dt * 6));
  camera.lookAt(camLookCurrent);
}

/* ============================================================
   UI / SCREENS
   ============================================================ */
function showScreen(name) {
  state.screen = name;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  if (name !== 'playing') $(name + '-screen').classList.add('active');
  $('hud').style.display = name === 'playing' ? 'block' : 'none';
}

function updateHUD() {
  $('hud-score').textContent = state.score;
  $('hud-coins').textContent = state.coins;
}

function resetGame() {
  // clear old snakes
  for (const s of allSnakes) { if (s.alive) s.die(); }
  allSnakes.length = 0;
  // clear fruits
  for (const f of fruits) { scene.remove(f.mesh); f.mesh.geometry.dispose(); f.mesh.material.dispose(); }
  fruits.length = 0;

  state.score = 0; state.coins = 0; state.snakeAlive = true;
  updateHUD();

  // player
  player = new Snake({
    isPlayer: true, skin: SKINS[state.skin],
    x: 0, z: -4, dx: 0, dz: 1, speed: 6.4, turnSpeed: 3.0,
  });
  allSnakes.push(player);

  // bots
  for (let i = 0; i < BOT_COUNT; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 14 + Math.random() * 12;
    const bot = new Snake({
      isPlayer: false,
      name: BOT_NAMES[i % BOT_NAMES.length],
      x: Math.cos(a) * r, z: Math.sin(a) * r,
      skin: SKINS[1 + (i % (SKINS.length - 1))],
      speed: 5.4 + Math.random() * 1.2,
    });
    allSnakes.push(bot);
  }

  // initial fruits
  for (let i = 0; i < 8; i++) spawnFruit();

  gameRunning = true;
  lastTime = performance.now();
  showScreen('playing');
}

function gameOver() {
  if (!player.alive) return;
  gameRunning = false;
  state.screen = 'gameover';
  state.totalCoins += state.coins;
  state.bestScore = Math.max(state.bestScore, state.score);
  saveProgress();

  $('go-score').textContent = state.score;
  $('go-coins').textContent = state.coins;
  $('go-length').textContent = player.length;

  // interstitial on game over
  showInterstitial('game_over');

  showScreen('gameover');
}

/* ============================================================
   PLAYGAMA ADS
   ============================================================ */
let lastInterstitial = 0;
function showInterstitial(placement = 'default') {
  if (!bridgeReady || !window.bridge) return;
  try {
    if (bridge.advertisement.isInterstitialSupported === false) return;
    if (Date.now() - lastInterstitial < 45000) return;
    lastInterstitial = Date.now();
    bridge.advertisement.showInterstitial(placement);
  } catch (e) { console.warn('interstitial', e); }
}

function showRewarded(placement, onReward) {
  if (!bridgeReady || !window.bridge) {
    // fallback: just grant reward in standalone
    onReward();
    return;
  }
  try {
    if (bridge.advertisement.isRewardedSupported === false) { onReward(); return; }
    let granted = false;
    const handler = (state) => {
      if (state === 'rewarded' && !granted) { granted = true; onReward(); }
      if (state === 'closed' || state === 'failed') {
        bridge.advertisement.off(bridge.EVENT_NAME.REWARDED_STATE_CHANGED, handler);
      }
    };
    bridge.advertisement.on(bridge.EVENT_NAME.REWARDED_STATE_CHANGED, handler);
    bridge.advertisement.showRewarded(placement);
  } catch (e) { console.warn('rewarded', e); onReward(); }
}

/* ============================================================
   SHOP UI
   ============================================================ */
function renderShop() {
  $('shop-coins').textContent = state.totalCoins;

  // skins
  const skinsGrid = $('skins-grid');
  skinsGrid.innerHTML = '';
  SKINS.forEach((skin, i) => {
    const owned = state.ownedSkins.includes(i);
    const equipped = state.skin === i;
    const card = document.createElement('div');
    card.className = 'shop-card' + (owned ? ' owned' : '') + (equipped ? ' equipped' : '');
    card.innerHTML = `
      <div class="preview" style="background:radial-gradient(circle at 35% 35%, #${skin.head.toString(16).padStart(6,'0')}, #${skin.body.toString(16).padStart(6,'0')})"></div>
      <div class="card-name">${skin.name}</div>
      <div class="card-actions"></div>
      ${equipped ? '<div class="badge">✓</div>' : ''}
    `;
    const actions = card.querySelector('.card-actions');
    if (owned) {
      const btn = document.createElement('button');
      btn.className = 'btn btn-primary btn-small';
      btn.textContent = equipped ? 'Выбрано' : 'Выбрать';
      btn.disabled = equipped;
      btn.onclick = () => { state.skin = i; saveProgress(); renderShop(); };
      actions.appendChild(btn);
    } else {
      if (state.totalCoins >= skin.price) {
        const buy = document.createElement('button');
        buy.className = 'btn btn-gold btn-small';
        buy.textContent = `🪙 ${skin.price}`;
        buy.onclick = () => {
          state.totalCoins -= skin.price;
          state.ownedSkins.push(i);
          saveProgress(); renderShop(); beep(880);
        };
        actions.appendChild(buy);
      }
      const ad = document.createElement('button');
      ad.className = 'btn btn-ad btn-small';
      ad.textContent = '📺 Реклама';
      ad.onclick = () => {
        showRewarded('skin_unlock', () => {
          state.ownedSkins.push(i);
          saveProgress(); renderShop(); beep(880, 0.25, 'square');
        });
      };
      actions.appendChild(ad);
    }
    skinsGrid.appendChild(card);
  });

  // locations
  const locGrid = $('locations-grid');
  locGrid.innerHTML = '';
  LOCATIONS.forEach((loc, i) => {
    const owned = state.ownedLocations.includes(i);
    const equipped = state.location === i;
    const card = document.createElement('div');
    card.className = 'shop-card' + (owned ? ' owned' : '') + (equipped ? ' equipped' : '');
    card.innerHTML = `
      <div class="preview" style="background:linear-gradient(135deg, #${loc.sky.toString(16).padStart(6,'0')}, #${loc.ground.toString(16).padStart(6,'0')})"></div>
      <div class="card-name">${loc.name}</div>
      <div class="card-actions"></div>
      ${equipped ? '<div class="badge">✓</div>' : ''}
    `;
    const actions = card.querySelector('.card-actions');
    if (owned) {
      const btn = document.createElement('button');
      btn.className = 'btn btn-primary btn-small';
      btn.textContent = equipped ? 'Выбрано' : 'Выбрать';
      btn.disabled = equipped;
      btn.onclick = () => { state.location = i; saveProgress(); buildWorld(i); renderShop(); };
      actions.appendChild(btn);
    } else {
      if (state.totalCoins >= loc.price) {
        const buy = document.createElement('button');
        buy.className = 'btn btn-gold btn-small';
        buy.textContent = `🪙 ${loc.price}`;
        buy.onclick = () => {
          state.totalCoins -= loc.price;
          state.ownedLocations.push(i);
          saveProgress(); renderShop(); beep(880);
        };
        actions.appendChild(buy);
      }
      const ad = document.createElement('button');
      ad.className = 'btn btn-ad btn-small';
      ad.textContent = '📺 Реклама';
      ad.onclick = () => {
        showRewarded('location_unlock', () => {
          state.ownedLocations.push(i);
          saveProgress(); renderShop(); beep(880, 0.25, 'square');
        });
      };
      actions.appendChild(ad);
    }
    locGrid.appendChild(card);
  });
}

  sfx.value = Math.round(state.sfxVolume * 100);
  mus.value = Math.round(state.musicVolume * 100);

  sfx.oninput = () => {

    updateVolumes(); saveProgress();

  mus.oninput = () => {
    state.musicVolume = mus.value / 100; vm.textContent = mus.value;
    updateVolumes(); saveProgress();
  };
}

(function boot() {
  buildWorld(state.location);
  // hide loader
  setTimeout(() => {
    $('loading').style.opacity = '0';
    setTimeout(() => $('loading').style.display = 'none', 400);
  }, 500);

  animate();
  // periodic save
  setInterval(() => { if (state.screen === 'playing') saveProgress(); }, 15000);
})();
</script>
